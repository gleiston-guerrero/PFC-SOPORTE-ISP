openapi: 3.0.3
info:
  title: Sistema de Soporte Técnico ISP — equipo ACC
  description: >
    Contrato REST de los 5 microservicios del PFC. Cada servicio corre en su
    propio puerto y mantiene su propia base de datos (auth_db / ticket_db /
    notifications_db / ai_db / report_db). Desde la Entrega 4 el punto de
    entrada único para los clientes (web y móvil) es el API Gateway en el
    puerto 8000, que reenvía cada prefijo /api/v1/<servicio>/** al
    microservicio correspondiente sin reescribir la ruta (ver
    services/api-gateway/src/main/resources/application.yml) -- los puertos
    directos de cada servicio siguen respondiendo (útiles para depurar un
    servicio en aislamiento) pero ya no son la vía real de acceso.
  version: "4.0.0"
  contact:
    name: Equipo ACC — Aplicaciones Distribuidas (ISR-701), UTEQ

servers:
  # Sin "servers:" a nivel de path, un cliente generado resuelve toda ruta contra servers[0]
  # (auth) -- hallazgo de una revision externa. Cada bloque paths./ruta de abajo declara su
  # propio "servers:" (ancla + alias de estos 10) para que apunte solo a su servicio real.
  - &auth_gateway
    url: http://localhost:8000/api/v1/auth
    description: auth-service, a través del API Gateway (Entrega 4, vía real)
  - &tickets_gateway
    url: http://localhost:8000/api/v1/tickets
    description: ticket-service, a través del API Gateway (Entrega 4, vía real)
  # A diferencia de auth/tickets/ai/reports (cuyo servers: ya incluye el segmento del
  # recurso porque cada uno tiene mas de una ruta debajo), notification-service solo
  # tiene un endpoint real (la coleccion en si, GET /api/v1/notifications, sin
  # sub-recursos) -- si el servers: tambien terminara en "/notifications", el path de
  # abajo (que necesita seguir siendo "/notifications", no "/", porque "/" ya lo usa
  # tickets_gateway en este mismo documento) duplicaria el segmento y resolveria a
  # /api/v1/notifications/notifications, que no existe (hallazgo real de una revision
  # externa: ese cliente generado daba 404). Este servers: se detiene en /api/v1.
  - &notifications_gateway
    url: http://localhost:8000/api/v1
    description: notification-service, a través del API Gateway (Entrega 4, vía real)
  - &ai_gateway
    url: http://localhost:8000/api/v1/ai
    description: ai-service, a través del API Gateway (Entrega 4, vía real)
  - &reports_gateway
    url: http://localhost:8000/api/v1/reports
    description: report-service, a través del API Gateway (Entrega 4, vía real)
  - &auth_direct
    url: http://localhost:8001/api/v1/auth
    description: auth-service, puerto directo (solo depuración local, Entrega 2)
  - &tickets_direct
    url: http://localhost:8002/api/v1/tickets
    description: ticket-service, puerto directo (solo depuración local, Entrega 2)
  - &notifications_direct
    url: http://localhost:8003/api/v1
    description: notification-service, puerto directo (solo depuración local, Entrega 2)
  - &ai_direct
    url: http://localhost:8004/api/v1/ai
    description: ai-service, puerto directo (solo depuración local, Entrega 2)
  - &reports_direct
    url: http://localhost:8005/api/v1/reports
    description: report-service, puerto directo (solo depuración local, Entrega 2)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      description: >
        Envoltura estándar de respuesta. auth-service, ticket-service y report-service (Java) la
        producen con la misma clase ApiResponse; notification-service (Node) construye a mano un
        objeto con la misma forma. ai-service (FastAPI) es la única excepción: devuelve el
        documento sin envolver (ver /classifications/{ticket_id}).
      properties:
        data: {}
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    Ticket:
      type: object
      properties:
        zone:
          type: string
          enum: [QUEVEDO_CENTRO, QUEVEDO_NORTE, QUEVEDO_SUR]
        ticketId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        technicianId:
          type: string
          format: uuid
          nullable: true
        category:
          type: string
          nullable: true
          enum: [CONECTIVIDAD, DNS, HARDWARE, CONFIGURACION, VELOCIDAD]
        priority:
          type: string
          nullable: true
          enum: [CRITICO, ALTO, MEDIO, BAJO]
        status:
          type: string
          enum: [NUEVO, ASIGNADO, EN_PROGRESO, ESCALADO, RESUELTO, CERRADO]
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        slaDeadline:
          type: string
          format: date-time
        slaBreached:
          type: boolean
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    CreateTicketRequest:
      type: object
      required: [zone, title, description]
      properties:
        zone:
          type: string
          enum: [QUEVEDO_CENTRO, QUEVEDO_NORTE, QUEVEDO_SUR]
        title:
          type: string
        description:
          type: string
        contactPhone:
          type: string
        address:
          type: string

    AuthResponse:
      type: object
      description: Par de tokens emitido por /login y rotado por /refresh.
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time

    ValidateResponse:
      type: object
      description: >
        Devuelto por GET /validate y consumido por AuthGatewayFilter de los demás servicios
        para poblar authUserId/authRole/authZone.
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [CLIENTE, TECNICO, ADMIN]
        zone:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UserResponse:
      type: object
      description: Cuenta devuelta por el CRUD de administración. Nunca incluye la contraseña ni su hash.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [CLIENTE, TECNICO, ADMIN]
        zone:
          type: string
          nullable: true
          description: Solo se rellena para role=TECNICO.
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationEvent:
      type: object
      description: Notificación simulada (demo/depuración, notification-service no envía correo/SMS real).
      properties:
        ticketId:
          type: string
          format: uuid
        zone:
          type: string
        eventType:
          type: string
          enum: [ticket.created, ticket.status-changed, ticket.assigned]
        channel:
          type: string
          enum: [EMAIL, SMS]
        message:
          type: string
        simulated:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Classification:
      type: object
      description: Clasificación automática guardada por ai-service para un ticket.
      properties:
        ticketId:
          type: string
          format: uuid
        zone:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [CONECTIVIDAD, DNS, HARDWARE, CONFIGURACION, VELOCIDAD]
        priority:
          type: string
          enum: [CRITICO, ALTO, MEDIO, BAJO]
        suggestion:
          type: string
        classifiedAt:
          type: string
          format: date-time

    SummaryResponse:
      type: object
      description: Agregados del modelo de lectura CQRS de report-service.
      properties:
        totalTickets:
          type: integer
          format: int64
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
        byZone:
          type: object
          additionalProperties:
            type: integer
            format: int64
        byCategory:
          type: object
          additionalProperties:
            type: integer
            format: int64

    IncidenciaResponse:
      type: object
      description: >
        Agrupamiento de tickets correlacionados (CORREL, ver docs/adr/0008-correl-incidencias.md).
        Consumidor principal: experimentos/analizar_correlacion.py.
      properties:
        incidenciaId:
          type: string
          format: uuid
        zone:
          type: string
          enum: [QUEVEDO_CENTRO, QUEVEDO_NORTE, QUEVEDO_SUR]
        createdAt:
          type: string
          format: date-time
        correlMode:
          type: string
          enum: [c0, c1, c2]
        ticketIds:
          type: array
          items:
            type: string
            format: uuid

    TicketSummaryResponse:
      type: object
      description: Fila del modelo de lectura CQRS (report-service), no el mismo objeto que Ticket.
      properties:
        zone:
          type: string
        ticketId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        technicianId:
          type: string
          format: uuid
          nullable: true
        category:
          type: string
        priority:
          type: string
        status:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
    Forbidden:
      description: Rol autenticado sin permiso para esta operación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

paths:
  /register:
    servers: [*auth_gateway, *auth_direct]
    post:
      tags: [auth-service]
      summary: Registro público (fuerza rol CLIENTE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                fullName: { type: string }
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserResponse" }

  /login:
    servers: [*auth_gateway, *auth_direct]
    post:
      tags: [auth-service]
      summary: Login, devuelve access token + refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: accessToken/refreshToken emitidos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /refresh:
    servers: [*auth_gateway, *auth_direct]
    post:
      tags: [auth-service]
      summary: Rota el refresh token (detecta reuso y revoca en cascada)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Nuevo par access/refresh token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /logout:
    servers: [*auth_gateway, *auth_direct]
    post:
      tags: [auth-service]
      summary: Revoca un refresh token
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "200":
          description: Sesión cerrada (data siempre null)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /validate:
    servers: [*auth_gateway, *auth_direct]
    get:
      tags: [auth-service]
      summary: Valida un access token (consumido por AuthGatewayFilter de otros servicios)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: userId/role/zone del token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ValidateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/users:
    servers: [*auth_gateway, *auth_direct]
    post:
      tags: [auth-service]
      summary: Crear cuenta CLIENTE/TECNICO/ADMIN (solo ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, role]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                fullName: { type: string }
                role: { type: string, enum: [CLIENTE, TECNICO, ADMIN] }
                zone:
                  type: string
                  description: Obligatorio si role=TECNICO, prohibido en otro caso
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [auth-service]
      summary: Listar todas las cuentas (solo ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/UserResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /:
    servers: [*tickets_gateway, *tickets_direct]
    post:
      tags: [ticket-service]
      summary: Crear ticket (CLIENTE/ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTicketRequest" }
      responses:
        "201":
          description: Ticket creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Ticket" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [ticket-service]
      summary: Listar tickets (filtrado por rol -- ver TicketService)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: zone
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Lista de tickets visibles para el rol autenticado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Ticket" }

  /{id}:
    servers: [*tickets_gateway, *tickets_direct]
    get:
      tags: [ticket-service]
      summary: Detalle de un ticket por id
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ticket encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Ticket" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Ticket no encontrado }

  /{id}/status:
    servers: [*tickets_gateway, *tickets_direct]
    patch:
      tags: [ticket-service]
      summary: Cambiar estado (TECNICO en su zona / ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [NUEVO, ASIGNADO, EN_PROGRESO, ESCALADO, RESUELTO, CERRADO] }
                evidencePhotoBase64:
                  type: string
                  format: byte
                  nullable: true
                  maxLength: 8000000
                  description: >-
                    Foto de evidencia del cierre en sitio, codificada en Base64. Opcional: solo
                    la manda la app móvil cuando status=RESUELTO (Entregable 10 de la guía de
                    cierre); en cualquier otra transición el servicio la ignora aunque llegue.
                    Límite de 8 000 000 caracteres (~6 MB decodificados), igual que
                    @Size(max=8_000_000) en UpdateStatusRequest.java — el móvil comprime la foto
                    antes de enviarla (TicketDetailScreen.kt) para quedar muy por debajo.
                latitude:
                  type: number
                  format: double
                  nullable: true
                  minimum: -90
                  maximum: 90
                  description: >-
                    Latitud GPS capturada al cerrar en sitio. Opcional, mismo caso que
                    evidencePhotoBase64. Rango geométrico válido de coordenadas, igual que
                    @DecimalMin/@DecimalMax en UpdateStatusRequest.java.
                longitude:
                  type: number
                  format: double
                  nullable: true
                  minimum: -180
                  maximum: 180
                  description: >-
                    Longitud GPS capturada al cerrar en sitio. Opcional, mismo caso que
                    evidencePhotoBase64. Rango geométrico válido de coordenadas, igual que
                    @DecimalMin/@DecimalMax en UpdateStatusRequest.java.
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Ticket" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /{id}/assign:
    servers: [*tickets_gateway, *tickets_direct]
    post:
      tags: [ticket-service]
      summary: Asignar técnico (TECNICO en su zona / ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: technicianId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Técnico asignado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Ticket" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /incidencias:
    servers: [*tickets_gateway, *tickets_direct]
    get:
      tags: [ticket-service]
      summary: Incidencias (agrupamiento CORREL de tickets correlacionados)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: zone
          in: query
          schema: { type: string, enum: [QUEVEDO_CENTRO, QUEVEDO_NORTE, QUEVEDO_SUR] }
      responses:
        "200":
          description: Lista de incidencias
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/IncidenciaResponse" }

  /notifications:
    servers: [*notifications_gateway, *notifications_direct]
    get:
      tags: [notification-service]
      summary: Notificaciones simuladas guardadas (demo/depuración)
      parameters:
        - name: ticketId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista de notificaciones simuladas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/NotificationEvent" }

  /classifications/{ticket_id}:
    servers: [*ai_gateway, *ai_direct]
    get:
      tags: [ai-service]
      summary: Clasificación guardada para un ticket
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: category/priority/suggestion clasificados (ai-service devuelve el documento sin envoltura ApiResponse)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classification" }
        "404": { description: Aún no se procesó ese ticket }

  /summary:
    servers: [*reports_gateway, *reports_direct]
    get:
      tags: [report-service]
      summary: Agregados del modelo de lectura CQRS (solo ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: totalTickets/byStatus/byZone/byCategory
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SummaryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tickets:
    servers: [*reports_gateway, *reports_direct]
    get:
      tags: [report-service]
      summary: Lista filtrable del modelo de lectura (solo ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: zone
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Lista de TicketSummaryResponse
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TicketSummaryResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /export.csv:
    servers: [*reports_gateway, *reports_direct]
    get:
      tags: [report-service]
      summary: Exportación CSV del modelo de lectura (solo ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Archivo CSV
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
