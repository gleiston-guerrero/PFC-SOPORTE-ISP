server:
  port: 8002

spring:
  application:
    name: ticket-service

  datasource:
    # Por defecto apunta al primer nodo del cluster local (docker-compose.cockroach.yml).
    # En Docker Compose del PFC, sobreescribir con la variable de entorno DB_URL.
    url: ${DB_URL:jdbc:postgresql://localhost:26257/ticket_db?sslmode=disable}
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver

  jpa:
    # El esquema (incluyendo PARTITION BY) ya lo gestiona Flyway (db/migration/, Entregable 5
    # de la guia de cierre). Hibernate NUNCA debe recrear ni alterar la tabla particionada, y
    # "validate" (a diferencia de "none") ademas verifica en el arranque que las entidades JPA
    # coincidan con el esquema real que Flyway aplico -- "none" no detectaria una migracion que
    # dejara de agregar una columna que una entidad si espera; "validate" rompe el arranque con
    # el nombre exacto de la columna/tabla que falta, sin llegar a alterar nada.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # CockroachDB no soporta todas las extensiones del dialecto Postgres; el dialecto
        # estandar de PostgreSQL funciona para las operaciones CRUD basicas usadas aqui.
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # JSON plano como texto (no el JsonSerializer de Spring, que agrega headers con
    # nombres de clases Java) -- el consumidor/productor del otro lado es Python
    # (ai-service) y no tiene por que conocer tipos Java. Cada servicio arma/parsea
    # el JSON el mismo con su propia libreria (Jackson aqui, json en Python).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ticket-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

auth:
  service:
    # auth-service valida los access tokens (GET /validate) para cada request a
    # /api/v1/tickets/** -- ver config/AuthGatewayFilter.java.
    base-url: ${AUTH_SERVICE_URL:http://localhost:8001/api/v1/auth}

# Adicion 1 (Ampliacion del Modulo G) -- ver application/correlation/CorrelationService.java
# y docs/adr/0008-correl-incidencias.md. CORREL selecciona la estrategia: c0 (sin
# correlacion, linea base) | c1 (zona+ventana) | c2 (zona+ventana+telemetria).
correlation:
  mode: ${CORREL:c0}
  window-minutes: ${CORREL_WINDOW_MINUTES:15}

# Cliente gRPC hacia telemetry-service (PE-U1) -- solo lo usa la estrategia c2.
telemetry:
  service:
    host: ${TELEMETRY_SERVICE_HOST:localhost}
    grpc-port: ${TELEMETRY_SERVICE_GRPC_PORT:9095}

management:
  endpoints:
    web:
      exposure:
        # "prometheus" expone /actuator/prometheus con las metricas incrementales
        # de D3.2 (ver config/CrdbMetrics.java) ademas de las metricas estandar de
        # Spring Boot (JVM, HTTP, HikariCP).
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    ec.edu.uteq.soporte: INFO
    org.hibernate.SQL: DEBUG
