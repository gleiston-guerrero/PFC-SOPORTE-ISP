server:
  port: 8005

spring:
  application:
    name: report-service

  datasource:
    # Base propia report_db (ver services/report-service/src/main/resources/db/migration/V1__init_report_schema.sql), en el mismo
    # cluster CockroachDB que el resto de servicios.
    url: ${DB_URL:jdbc:postgresql://localhost:26257/report_db?sslmode=disable}
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver

  jpa:
    # El esquema lo gestiona Flyway (db/migration/, Entregable 5 de la guia de cierre) --
    # Hibernate nunca crea/altera la tabla, y "validate" ademas rompe el arranque si la entidad
    # deja de coincidir con lo que Flyway aplico -- "none" no lo detectaria.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Mismo criterio que ticket-service/ai-service: JSON plano como texto, sin el
    # JsonSerializer de Spring (evita headers con nombres de clases Java).
    consumer:
      group-id: report-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

auth:
  service:
    # auth-service valida los access tokens (GET /validate); report-service ademas
    # exige que el rol sea ADMIN -- ver config/AuthGatewayFilter.java.
    base-url: ${AUTH_SERVICE_URL:http://localhost:8001/api/v1/auth}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    ec.edu.uteq.soporte: INFO
    org.hibernate.SQL: DEBUG
