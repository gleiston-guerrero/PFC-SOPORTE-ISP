server:
  port: ${SERVER_PORT:8001}

spring:
  application:
    name: auth-service

  datasource:
    # Por defecto apunta al primer nodo del cluster local (docker-compose.cockroach.yml).
    # En Docker Compose del PFC, sobreescribir con la variable de entorno DB_URL.
    url: ${DB_URL:jdbc:postgresql://localhost:26257/auth_db?sslmode=disable}
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver

  jpa:
    # El esquema ya lo gestiona Flyway (db/migration/V1__init_auth_schema.sql, Entregable 5 de
    # la guia de cierre). Hibernate NUNCA debe recrear ni alterar las tablas de este servicio, y
    # "validate" ademas rompe el arranque si una entidad JPA deja de coincidir con lo que Flyway
    # aplico -- "none" no lo detectaria.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # CockroachDB no soporta todas las extensiones del dialecto Postgres; el dialecto
        # estandar de PostgreSQL funciona para las operaciones CRUD basicas usadas aqui.
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Solo productor (auth-service no consume nada): publica "technician.created" para que
  # ticket-service sincronice su tabla technicians (ver TechnicianEventPublisher). JSON
  # plano como texto, mismo criterio que ticket-service (el consumidor es otro servicio
  # Java con su propio Jackson, no hace falta el JsonSerializer con headers de tipo).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

auth:
  jwt:
    # ADVERTENCIA: este secreto por defecto es solo para desarrollo local. Cualquier
    # despliegue compartido debe sobreescribirlo con AUTH_JWT_SECRET (minimo 32 bytes).
    secret: ${AUTH_JWT_SECRET:dev-only-insecure-secret-please-change-me-3242}
    access-ttl-minutes: ${AUTH_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${AUTH_REFRESH_TTL_DAYS:7}

admin:
  bootstrap:
    # Cuenta ADMIN creada automaticamente al primer arranque si no existe ninguna todavia
    # (ver config/AdminBootstrap.java). Cambiar la contrasena por defecto en cualquier
    # entorno compartido.
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@soporte.local}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    ec.edu.uteq.soporte: INFO
    org.hibernate.SQL: DEBUG
