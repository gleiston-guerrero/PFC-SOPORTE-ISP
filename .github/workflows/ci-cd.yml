name: CI/CD

# Pipeline de 7 jobs exigido por la rubrica de Entrega 4 (Modulo D, "pipeline con al menos
# lint, pruebas por capa, build de imagenes y un job de integracion"). Sustituye al ci.yml
# de Entrega 3 (que solo corria pruebas unitarias por servicio): ese trabajo ahora vive
# adentro de test-backend, y se le agrega lint, pruebas de web/mobile, build de imagenes
# Docker (publicadas en GHCR) y un job de integracion que levanta el stack COMPLETO
# (docker-compose.yml de la raiz) para correr Playwright (E2E real) y la verificacion del
# proveedor Pact contra un backend real -- no mocks -- exactamente como se verifico a mano
# antes de escribir este archivo.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # 1. lint
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: apps/web - npm ci
        working-directory: apps/web
        run: npm ci

      - name: apps/web - eslint
        working-directory: apps/web
        run: npm run lint

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: apps/mobile - habilitar gradlew
        # gradlew se committeo desde Windows sin el bit ejecutable de Unix -- "exit code 126:
        # Permission denied" -- se corrige aqui mismo, sin depender de que alguien lo arregle
        # en el repo. El problema hermano (CRLF, que corrompia el script de forma sutil: el
        # interprete confundia sus propios argumentos de memoria, ej. "-Xmx64m", con el nombre
        # de una clase a ejecutar) ya no puede ocurrir -- gradlew tiene "eol=lf" fijado en
        # .gitattributes (Entregable 40 de la guia de cierre), asi que el "sed -i 's/\r$//'"
        # que corria aqui antes quedaba operando siempre sobre un archivo ya en LF.
        run: |
          chmod +x apps/mobile/gradlew

      - name: apps/mobile - android lint
        working-directory: apps/mobile
        run: ./gradlew :app:lintDebug --console=plain

  # ============================================================
  # validate-openapi: rompe la construccion si alguna operacion de docs/api/openapi.yaml deja
  # de declarar content/schema en su respuesta de exito (regla propia response-schema-required
  # en .spectral.yaml). Nace de la correccion E4/Entrega 4: el profesor senalo 4 operaciones sin
  # esquema, y al revisar el contrato completo eran 11 de 17 -- esta regla evita que vuelva a
  # pasar sin que el CI lo note.
  # ============================================================
  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Spectral lint sobre docs/api/openapi.yaml
        run: npx --yes @stoplight/spectral-cli lint docs/api/openapi.yaml --ruleset .spectral.yaml --fail-severity=error

  # ============================================================
  # 2. test-backend: los 4 servicios Java (Maven) + notification-service (Node) +
  #    ai-service (Python). svc-principal incluye las pruebas de integracion con
  #    Testcontainers (CockroachDB real en Docker, ver TicketRepositoryIntegrationTest.java)
  #    -- Docker ya viene preinstalado en ubuntu-latest, sin configuracion adicional.
  #    El Pact provider test (TicketServiceProviderPactTest) NO corre aqui a proposito:
  #    necesita el stack completo levantado, y eso es justo lo que hace el job "integration".
  # ============================================================
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: auth-service - mvn test
        working-directory: services/auth-service
        run: mvn -B test

      - name: svc-principal (ticket-service) - mvn test
        working-directory: services/svc-principal
        run: mvn -B test

      - name: report-service - mvn test
        working-directory: services/report-service
        run: mvn -B test

      - name: api-gateway - mvn test
        working-directory: services/api-gateway
        run: mvn -B test

      - name: telemetry-service - mvn test
        working-directory: services/telemetry-service
        run: mvn -B test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/notification-service/package.json

      - name: notification-service - npm test
        working-directory: services/notification-service
        run: |
          npm install
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ai-service - pytest
        working-directory: services/ai-service
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v

  # ============================================================
  # 3. test-web: pruebas unitarias/de componente con Vitest (incluye el contrato Pact del
  #    CONSUMIDOR, ver tests/contract/ticketsApi.pact.test.ts -- vitest lo recoge junto con
  #    el resto por su nombre *.test.ts, no hace falta un paso aparte).
  # ============================================================
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        working-directory: apps/web
        run: npm ci

      - name: npm test (Vitest, incluye contrato Pact del consumidor)
        working-directory: apps/web
        run: npm test

  # ============================================================
  # 4. test-mobile: pruebas unitarias de ViewModel (JVM, sin emulador) + las pruebas
  #    instrumentadas de Compose Testing (Modulo C item 6) en un emulador headless real
  #    (reactivecircus/android-emulator-runner, estandar de la comunidad para Android en
  #    GitHub Actions -- no hay forma de correr un instrumented test sin un dispositivo o
  #    emulador real).
  # ============================================================
  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: apps/mobile - habilitar gradlew
        run: |
          chmod +x apps/mobile/gradlew

      - name: Pruebas unitarias de ViewModel (JVM)
        working-directory: apps/mobile
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pruebas instrumentadas (Compose Testing) en emulador headless
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          working-directory: apps/mobile
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

  # ============================================================
  # 5. build-images: imagenes Docker de los 7 microservicios + apps/web, publicadas en GHCR.
  #    telemetry-service se agrego a esta matriz y a test-backend (abajo): tenia Dockerfile,
  #    tres archivos de prueba JUnit reales y ni se probaba ni se publicaba, sin que ningun
  #    job del flujo lo ejecutara -- hallazgo documentado en el commit 2c5bba5 y cerrado aqui.
  #    Solo en push (no en pull_request, para no llenar el registry de imagenes de prueba).
  #    needs incluye los 5 jobs de verificacion (no solo test-backend/test-web): antes
  #    publicaba igual aunque lint o test-mobile quedaran en rojo -- encontrado en una
  #    auditoria externa del pipeline, no era una compuerta de calidad real como decia
  #    el manuscrito (ver secciones/pruebas_cicd.tex). Una segunda auditoria encontro que
  #    "integration" (el unico job que prueba contra el stack real, no mocks) corria en
  #    PARALELO con este job en vez de antes -- se agrega tambien a needs, sin crear
  #    dependencia circular porque integration construye sus propias imagenes localmente
  #    via "docker compose up --build", no depende de las que publica GHCR. Una tercera
  #    auditoria (entregable #4 de la guia de cierre) encontro que un contrato OpenAPI roto
  #    ponia el run en rojo (validate-openapi) pero no impedia publicar igual las imagenes,
  #    porque este job tampoco dependia de ese trabajo -- se agrega tambien.
  # ============================================================
  build-images:
    needs: [lint, validate-openapi, test-backend, test-web, test-mobile, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sin esto, GITHUB_TOKEN no puede CREAR un paquete nuevo en GHCR la primera vez que
      # se publica cada imagen ("denied: installation not allowed to Create organization
      # package") -- el permiso por defecto del token para "packages" es de solo lectura.
    strategy:
      matrix:
        include:
          - name: auth-service
            context: services/auth-service
          - name: ticket-service
            context: services/svc-principal
          - name: report-service
            context: services/report-service
          - name: api-gateway
            context: services/api-gateway
          - name: telemetry-service
            context: services/telemetry-service
          - name: notification-service
            context: services/notification-service
          - name: ai-service
            context: services/ai-service
          - name: web
            context: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Crea un builder de Buildx nuevo y limpio para este job. Sin este paso,
        # build-push-action usa el builder implicito del runner, que a veces arrastra
        # cache de capas corrupta entre invocaciones y produce el error observado en
        # el run 33264918110 (matrix notification-service):
        # "buildx failed with: ERROR: failed to build: unknown blob"
        #
        # driver-opts: network=host -- por defecto este builder corre BuildKit dentro
        # de un contenedor Docker aislado (driver "docker-container"), con su propia
        # red bridge. Eso puede causar fallos intermitentes de DNS/red para cualquier
        # RUN que necesite internet (ej. "mvn dependency:go-offline" descargando de
        # repo.maven.apache.org / repo.spring.io), como se vio en el run 33279077034
        # (matrix api-gateway): "mvn dependency:go-offline -B ... exit code: 1".
        # Con network=host, el builder comparte la red del runner directamente,
        # eliminando esa capa de aislamiento de red.
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Nombre del repositorio en minusculas
        # Docker exige que el nombre del repositorio de una imagen sea todo minusculas
        # ("repository name must be lowercase") -- github.repository trae el nombre real
        # del repo (ej. carlospatroner-boop/PFC-SOPORTE-ISP), que puede tener mayusculas.
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.name }}:latest

  # ============================================================
  # 6. build-mobile-apk: compila el APK debug y lo deja como artefacto descargable del run
  #    (Modulo C: "el pipeline debe producir un APK instalable").
  # ============================================================
  build-mobile-apk:
    # Entregable 16 de la guia de cierre (segunda correccion, encontrada por una evaluacion
    # externa del pipeline): antes este job solo dependia de [test-mobile, compile-latex],
    # asi que el APK firmado y el manuscrito se publicaban aunque lint, validate-openapi o
    # la suite completa de backend/web/integracion estuvieran en rojo -- el manuscrito ya
    # afirmaba "ningun artefacto se publica sin que los jobs de verificacion pasen primero"
    # (ver pruebas_cicd.tex), pero eso no era cierto para este job en particular, solo para
    # build-images. Se agregan las mismas dependencias que build-images (lint, test-backend,
    # test-web, test-mobile, integration) mas validate-openapi y compile-latex, que build-images
    # no necesita pero este job si.
    needs: [lint, validate-openapi, test-backend, test-web, test-mobile, integration, compile-latex]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: apps/mobile - habilitar gradlew
        run: |
          chmod +x apps/mobile/gradlew

      - name: Compilar APK debug
        working-directory: apps/mobile
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: soporte-mobile-debug-apk
          path: apps/mobile/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # E5 de la rubrica de consolidacion, nivel 10: "el flujo automatico lo genera, lo
      # firma y lo publica". Antes esto se hacia a mano (keytool + zipalign + apksigner
      # corridos localmente, ver apps/mobile/README.md). El .jks nunca se versiona (el
      # repo es publico) -- vive como secreto de GitHub Actions en base64
      # (ANDROID_KEYSTORE_BASE64), decodificado aqui a un archivo temporal que el runner
      # descarta al terminar el job.
      - name: Compilar APK release (sin firmar)
        working-directory: apps/mobile
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Decodificar el keystore de firma
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Alinear y firmar el APK release
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          echo "Usando build-tools en $BUILD_TOOLS"
          "${BUILD_TOOLS}zipalign" -v -p 4 \
            apps/mobile/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/app-release-aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks /tmp/release.jks --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" \
            --out release/apk/soporte-isp.apk /tmp/app-release-aligned.apk
          "${BUILD_TOOLS}apksigner" verify --verbose release/apk/soporte-isp.apk
          rm -f /tmp/release.jks /tmp/app-release-aligned.apk

      - name: Generar suma de verificacion del APK firmado
        run: |
          cd release/apk
          sha256sum soporte-isp.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: soporte-isp-release-firmado
          path: |
            release/apk/soporte-isp.apk
            release/apk/SHA256SUMS.txt
          retention-days: 90

      # Entregable 16 de la guia de cierre: baja el PDF que compile-latex subio como
      # artefacto de este mismo run, para incluirlo en el release de abajo junto al APK --
      # antes el release solo llevaba el instalable, no el manuscrito que exige el criterio.
      - name: Descargar el manuscrito compilado (artefacto de compile-latex, mismo run)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: manuscrito-pdf
          path: release/

      # El paso anterior deja el APK firmado solo como artefacto del run (GitHub lo borra
      # a los 90 dias): sirve para depurar ESE run puntual, pero no es una entrega estable
      # ni citable.
      #
      # Correccion real (Entregable 16, hallazgo de una evaluacion externa): el tag
      # "mobile-release" que se usaba antes NO es un tag de version -- softprops/action-gh-release
      # solo reutiliza el ref de git existente de un tag, nunca lo mueve al commit actual, asi
      # que aunque el Release se "actualizaba" en cada push, el tag de git seguia apuntando al
      # primer commit que lo creo. Resultado real observado: el tag quedo fijo en un commit del
      # 13/09 mientras los binarios adjuntos se reconstruian en cada push a main -- el tag y lo
      # que publicaba ya no correspondian. Este paso mueve el tag explicitamente al commit actual
      # ANTES de publicar, para que "vX.Y-entrega-final" sea una version real: siempre apunta al
      # commit de main del que salieron los binarios adjuntos.
      - name: Mover la etiqueta de version de la entrega al commit actual
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1.0-entrega-final "${{ github.sha }}"
          git push origin v1.0-entrega-final --force

      - name: Publicar la entrega estable (instalable + manuscrito, no como artefacto temporal)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-entrega-final
          name: "Entrega estable (instalable firmado + manuscrito)"
          body: >
            APK de release firmado y manuscrito compilado, generados automaticamente por el job
            build-mobile-apk de este mismo pipeline, unicamente cuando lint, validate-openapi,
            test-backend, test-web, test-mobile, integration y compile-latex ya pasaron en verde
            (ver needs de este job en ci-cd.yml). La etiqueta v1.0-entrega-final se mueve al
            commit actual en cada publicacion, asi que siempre apunta al mismo commit del que
            salieron estos binarios -- para el build asociado a un commit especifico mas
            antiguo, ver los artefactos soporte-isp-release-firmado y manuscrito-pdf del run
            correspondiente.
          files: |
            release/apk/soporte-isp.apk
            release/apk/SHA256SUMS.txt
            release/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 7. integration: levanta el stack COMPLETO (docker-compose.yml de la raiz: 3 nodos
  #    CockroachDB, Kafka, Mongo, los 6 microservicios, apps/web y observabilidad) y corre
  #    contra el ya arriba y de verdad:
  #      - la verificacion del PROVEEDOR del contrato Pact (necesita auth-service real, ver
  #        AuthGatewayFilter.java -- por eso no puede correr en test-backend)
  #      - Playwright E2E (navegador real -> web -> gateway -> backend real)
  #    Es el unico lugar donde se prueba la integracion end-to-end de verdad, no con mocks.
  # ============================================================
  integration:
    needs: [test-backend, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el stack completo
        # "docker compose up" espera de forma SINCRONA a que roach1/2/3 pasen su healthcheck
        # (depends_on: condition: service_healthy de db-init) y falla el comando entero si no
        # lo logran -- eso significa que nunca llegamos al paso siguiente (que sí volcaria
        # logs), y hasta ahora solo veiamos "exit code 1" sin saber por que roach1 quedaba
        # unhealthy. Si este comando falla, se vuelcan aqui mismo los logs reales de los 3
        # nodos antes de fallar el job, para diagnosticar la causa real en vez de adivinar.
        run: |
          docker compose up -d --build || {
            echo "FALLO 'docker compose up' -- logs de los 3 nodos de CockroachDB:"
            docker compose logs roach1 roach2 roach3
            exit 1
          }

      - name: Esperar a que auth-service y ticket-service esten healthy
        # 40 intentos x 15s = 10 minutos: un runner compartido de GitHub (2 CPU) construye
        # y arranca 17 contenedores desde cero (sin cache de capas), notablemente mas lento
        # que una maquina de desarrollo con las imagenes ya construidas -- el primer intento
        # de este job en produccion fallo con un timeout de solo 5 minutos.
        run: |
          for i in $(seq 1 40); do
            AUTH=$(docker inspect --format='{{.State.Health.Status}}' auth-service 2>/dev/null || echo "starting")
            TICKET=$(docker inspect --format='{{.State.Health.Status}}' ticket-service 2>/dev/null || echo "starting")
            echo "intento $i: auth-service=$AUTH ticket-service=$TICKET"
            if [ "$AUTH" = "healthy" ] && [ "$TICKET" = "healthy" ]; then exit 0; fi
            sleep 15
          done
          echo "El stack no quedo healthy a tiempo -- estado de todos los contenedores:"
          docker compose ps
          echo "--- logs de auth-service ---"; docker compose logs --tail 200 auth-service
          echo "--- logs de ticket-service ---"; docker compose logs --tail 200 ticket-service
          echo "--- logs de roach1 ---"; docker compose logs --tail 100 roach1
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verificacion del PROVEEDOR del contrato Pact (contra el stack real)
        working-directory: services/svc-principal
        # -Djacoco.skip=true: esta corrida ejercita un unico test contra el stack ya
        # levantado en Docker (el codigo real corre en el contenedor, no en esta JVM de
        # Maven), asi que JaCoCo mediria 0% aqui y rompería la compuerta del 70% sin
        # razon -- la cobertura real del modulo ya se mide en el job test-backend, que si
        # corre la suite completa.
        run: mvn -B -Dtest=TicketServiceProviderPactTest -DRUN_CONTRACT_VERIFICATION=true -Djacoco.skip=true test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Playwright - instalar navegadores
        working-directory: apps/web
        run: |
          npm ci
          # playwright.config.ts define 3 proyectos (chromium/firefox/webkit -- ver
          # comentario ahi, requisito de "Compatibilidad" de la rubrica). Instalar solo
          # "chromium" aqui hacia que firefox/webkit fallaran con "Executable doesn't
          # exist" apenas Chromium pasaba sus 3 pruebas. Sin argumento, install trae los
          # 3 navegadores que la config realmente usa.
          npx playwright install --with-deps

      - name: Playwright E2E (contra el stack real levantado arriba)
        working-directory: apps/web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  # ============================================================
  # 8. compile-latex
  # ============================================================
  # No exigido por la rubrica de los 7 jobs (Modulo D), pero se agrega para no repetir el
  # incidente real de esta entrega: el README recomendaba `texlive/texlive:latest-medium`
  # para compilar docs/latex/main.tex, esa imagen no trae `hyphenat`/`seqsplit`, y el
  # documento fallo con "! LaTeX Error: File 'hyphenat.sty' not found" sin que nada en CI
  # lo detectara -- lo encontro el docente al compilar el, no el pipeline. Este job compila
  # el manuscrito con la imagen completa (texlive/texlive:latest, la misma que documenta el
  # README) en cada push, para que un paquete faltante o una referencia rota fallen aqui.
  compile-latex:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: "Compilar main.tex (4 pasadas: pdflatex, bibtex, pdflatex x2)"
        working-directory: docs/latex
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Verificar cero referencias/citas indefinidas y cero etiquetas duplicadas
        working-directory: docs/latex
        run: |
          # Coincide solo con las advertencias reales de pdflatex/bibtex sobre referencias,
          # citas o etiquetas -- NO con "LaTeX Font Warning: ... undefined", que es un aviso
          # de sustitucion de fuente inofensivo y comun (coincidia antes con un grep -i
          # "undefined" demasiado amplio, dando un falso positivo en cada build).
          if grep -Ei "Reference .* undefined|Citation .* undefined|There were undefined (references|citations)" main.log; then
            echo "Hay referencias o citas indefinidas en main.log (ver arriba)."
            exit 1
          fi
          if grep -qi "multiply.defined" main.log; then
            echo "Hay etiquetas multiplemente definidas en main.log:"
            grep -i "multiply.defined" main.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: manuscrito-pdf
          path: docs/latex/main.pdf
          retention-days: 30


  # ============================================================
  # 9. verify-checksums: valida contra los datos crudos versionados que los tres manifiestos
  #    de verificacion (experimentos, campana de carga, instalable movil) siguen coincidiendo.
  #    Antes esto solo se comprobaba a mano; una discrepancia se detecta aqui sin intervencion
  #    humana, en vez de descubrirse (o no) al leer el manuscrito.
  # ============================================================
  verify-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar SHA256SUMS.txt de experimentos/resultados
        working-directory: experimentos/resultados
        run: sha256sum -c SHA256SUMS.txt

      - name: Verificar SHA256SUMS.txt de resultados/locust
        working-directory: resultados/locust
        run: sha256sum -c SHA256SUMS.txt

      - name: Verificar SHA256SUMS.txt del instalable movil
        working-directory: release/apk
        run: sha256sum -c SHA256SUMS.txt